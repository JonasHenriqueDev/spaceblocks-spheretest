plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = neo_version
    parchment { mappingsVersion = parchment_mappings_version; minecraftVersion = parchment_minecraft_version }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        periodicServer {
            server(); gameDirectory = project.file('run-periodic')
            programArgument '--nogui'
            systemProperty 'spaceblocks.testServer', 'true'
        }
        periodicClient {
            client(); gameDirectory = project.file('run-periodic')
            programArguments.addAll '--quickPlaySingleplayer', 'PeriodicTest', '--width', '1280', '--height', '720'
            systemProperty 'spaceblocks.testClient', 'true'
        }
        packagedPeriodicClient {
            systemProperty 'spaceblocks.packagedTest', 'true'
            client(); loadedMods = []; gameDirectory = project.file('run-periodic')
            programArguments.addAll '--quickPlaySingleplayer', 'PeriodicTest', '--width', '1280', '--height', '720'
            systemProperty 'spaceblocks.testClient', 'true'
        }
        packagedPeriodicServer {
            systemProperty 'spaceblocks.packagedTest', 'true'
            server(); loadedMods = []; gameDirectory = project.file('run-periodic')
            programArgument '--nogui'
            systemProperty 'spaceblocks.testServer', 'true'
        }
        packagedAtlasClient {
            client(); loadedMods = []; gameDirectory = project.file('run-atlas')
            programArguments.addAll '--quickPlaySingleplayer', 'PeriodicTest', '--width', '1280', '--height', '900'
            systemProperty 'spaceblocks.testClient', 'true'
            systemProperty 'spaceblocks.atlasClient', 'true'
        }
        packagedLabClient {
            client(); loadedMods = []; gameDirectory = project.file('run-atlas')
            programArguments.addAll '--quickPlaySingleplayer', 'PeriodicTest', '--width', '1280', '--height', '900'
            systemProperty 'spaceblocks.testClient', 'true'
            systemProperty 'spaceblocks.labClient', 'true'
            systemProperty 'spaceblocks.verifyPersistence', providers.gradleProperty('verifyPersistence').getOrElse('false')
        }
        packagedBottomClient {
            client(); loadedMods = []; gameDirectory = project.file('run-bottom')
            programArguments.addAll '--quickPlaySingleplayer', 'PeriodicTest', '--width', '1280', '--height', '900'
            systemProperty 'spaceblocks.testClient', 'true'
            systemProperty 'spaceblocks.bottomClient', 'true'
        }
        periodicPerformanceClient {
            client(); loadedMods = []; gameDirectory = project.file('run-performance')
            programArguments.addAll '--quickPlaySingleplayer', 'PeriodicTest', '--width', '1280', '--height', '720'
            systemProperty 'spaceblocks.testClient', 'true'
            systemProperty 'spaceblocks.performanceClient', 'true'
        }
        periodicNetworkServer {
            server(); loadedMods = []; gameDirectory = project.file('run-network-server')
            programArgument '--nogui'
            systemProperty 'spaceblocks.testNetworkServer', 'true'
        }
        periodicNetworkClient {
            client(); loadedMods = []; gameDirectory = project.file('run-network-client')
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25580', '--width', '1280', '--height', '720'
            systemProperty 'spaceblocks.testNetworkClient', 'true'
            systemProperty 'spaceblocks.twoClients', providers.gradleProperty('twoClients').getOrElse('false')
        }
        periodicNetworkObserver {
            client(); loadedMods = []; gameDirectory = project.file('run-network-observer')
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25580', '--username', 'Observer', '--width', '960', '--height', '640'
            systemProperty 'spaceblocks.testNetworkObserver', 'true'
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
var metadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [minecraft_version_range:minecraft_version_range, neo_version:neo_version,loader_version_range:loader_version_range,mod_id:mod_id,mod_name:mod_name,mod_license:mod_license,mod_version:mod_version]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { from('LICENSE'); from('CREDITS.md'); from('docs/SPHERETEST-SOURCES.md') }
